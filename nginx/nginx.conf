events {
  worker_connections 1024;
}

http {
  # container_name sesuai docker-compose.yml
  upstream frontend  { server datains_frontend:3000; }
  upstream backend   { server datains_backend:8000; }
  upstream superset  { server datains_superset:8088; }

  server {
    listen 80;
    server_name localhost;

    # 1. Frontend (Next.js)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Backend API (FastAPI)
    location /api/ {
      proxy_pass http://backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. API Docs (Swagger UI)
    location /docs {
      proxy_pass http://backend/docs;
      proxy_set_header Host $host;
    }

    # 3.1. Jalur file konfigurasi Swagger
    location /openapi.json {
      proxy_pass http://backend/openapi.json;
      proxy_set_header Host $host;
    }

    # 4. Superset BI Dashboard
    location /bi/ {
      proxy_pass http://superset/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
    }
  } # <-- Tutup Server
} # <-- Tutup HTTP