events {
  worker_connections 1024;
}

http {
  # container_name sesuai docker-compose.yml
  upstream frontend  { server datains_frontend:3000; }
  upstream backend   { server datains_backend:8000; }
  upstream superset  { server datains_superset:8088; }
  upstream n8n       { server datains_n8n:5678; } 

  server {
    listen 80;
    server_name localhost;

    # 1. Frontend (Next.js / React)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Backend API (FastAPI)
    location /api/ {
      proxy_pass http://backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. API Docs (Swagger UI)
    location /docs {
      proxy_pass http://backend/docs;
      proxy_set_header Host $host;
    }

    # 3.1. Jalur file konfigurasi Swagger
    location /openapi.json {
      proxy_pass http://backend/openapi.json;
      proxy_set_header Host $host;
    }

    # 4. Superset BI Dashboard
    location /bi/ {
      proxy_pass http://superset/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
    }

    # 5. n8n Automation (AI Chatbot Workflow) ─── ➕ TAMBAHKAN BLOK INI
    location /n8n/ {
      proxy_pass http://n8n/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      
      # Perlu WebSocket headers agar editor n8n tidak putus-putus (UI lancar)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

  } # <-- Tutup Server
} # <-- Tutup HTTP