version: "3.9"

services:
  # ─────────────────────────────────────────
  # DATABASES (Full PostgreSQL - OLTP, SDM, & Warehouse Lokal)
  # ─────────────────────────────────────────
  db_oltp:
    image: postgres:15
    container_name: datains_oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_akademik
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - oltp_data:/var/lib/postgresql/data
      # 🔒 Dikomen dulu karena di server berupa folder kosong (bikin crash)
      # - ./backend/app/db/oltp/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - datains_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_akademik"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_sdm:
    image: postgres:15
    container_name: datains_sdm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_sdm
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - sdm_data:/var/lib/postgresql/data
      # 🔒 Dikomen dulu karena di server berupa folder kosong (bikin crash)
      # - ./backend/app/db/oltp/init_sdm.sql:/docker-entrypoint-initdb.d/init_sdm.sql
    networks:
      - datains_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_sdm"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_warehouse:
    image: postgres:15
    container_name: datains_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_warehouse
    ports:
      - "127.0.0.1:5435:5432" # 🔒 Dipindah ke 5435 agar tidak bentrok dengan postgres n8n lama server
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      # 🔒 Dikomen dulu karena di server berupa folder kosong (bikin crash)
      # - ./backend/app/db/olap/init_warehouse.sql:/docker-entrypoint-initdb.d/init_warehouse.sql
    networks:
      - datains_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # BACKEND (FastAPI)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datains_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8005:8000" # 🔒 Kiri (8005) diubah biar gak nabrak
    depends_on:
      db_oltp:
        condition: service_healthy
      db_sdm:
        condition: service_healthy
      db_warehouse:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - datains_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────
  # FRONTEND (React Biasa)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datains_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3005:3000" # 🔒 Digeser ke port lokal 3005 (tidak bentrok varguard)
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # ETL (Python)
  # ─────────────────────────────────────────
  etl:
    build:
      context: ./backend/app/etl-generator
      dockerfile: Dockerfile
    container_name: datains_etl
    restart: unless-stopped
    env_file: .env
    depends_on:
      db_oltp:
        condition: service_healthy
      db_warehouse:
        condition: service_healthy
    volumes:
      - ./etl:/app
    networks:
      - datains_net
    command: tail -f /dev/null

  # ─────────────────────────────────────────
  # APACHE SUPERSET (BI Dashboard)
  # ─────────────────────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: datains_superset
    restart: unless-stopped
    env_file: .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "127.0.0.1:8089:8088" # 🔒 Digeser ke port lokal 8089
    depends_on:
      db_warehouse:
        condition: service_healthy
    volumes:
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py
      - superset_data:/app/superset_home
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # N8N (AI Chatbot Workflow)
  # ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: datains_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678" # 🔒 Digeser ke port lokal 5679 (tidak bentrok n8n server)
    environment:
    #  N8N_BASIC_AUTH_ACTIVE: "true"
    #  N8N_BASIC_AUTH_USER: ${N8N_USER}
    #  N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
    # N8N_HOST: localhost
      N8N_PORT: 5678
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - datains_net

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────
volumes:
  oltp_data:
    name: datains-capstone_oltp_data
    external: true
  sdm_data:
    name: datains-capstone_sdm_data
    external: true
  warehouse_data:
    name: datains-capstone_warehouse_data
    external: true
  superset_data:
    name: datains-capstone_superset_data
    external: true
  n8n_data:
    name: n8n_n8n_data  # 🔒 DIUBAH KE SINI agar memanggil data workflow lamamu yang aman!
    external: true

networks:
  datains_net:
    driver: bridge
