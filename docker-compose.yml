version: "3.9"

services:
  # ─────────────────────────────────────────
  # BACKEND (FastAPI)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datains_backend
    restart: unless-stopped
    env_file: .env # 🔑 Pastikan URL Supabase sudah ada di file .env lu nanti
    ports:
      - "127.0.0.1:8000:8000" # 🔒 DIKUNCI LOKAL
    volumes:
      - ./backend:/app
    networks:
      - datains_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────
  # FRONTEND (React Biasa - Cleaned)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datains_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000" # 🔒 DIKUNCI LOKAL
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # ETL (Python)
  # ─────────────────────────────────────────
  etl:
    build:
      context: ./backend/app/etl-generator
      dockerfile: Dockerfile
    container_name: datains_etl
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./etl:/app
    networks:
      - datains_net
    command: tail -f /dev/null

  # ─────────────────────────────────────────
  # APACHE SUPERSET (BI Dashboard)
  # ─────────────────────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: datains_superset
    restart: unless-stopped
    env_file: .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "127.0.0.1:8088:8088" # 🔒 DIKUNCI LOKAL
    volumes:
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py
      - superset_data:/app/superset_home
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # N8N (AI Chatbot Workflow)
  # ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: datains_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # 🔒 DIKUNCI LOKAL
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # NGINX (Reverse Proxy)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: datains_nginx
    restart: unless-stopped
    ports:
      - "80:80" # 🌍 Gerbang publik satu-satunya
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - superset
    networks:
      - datains_net

volumes:
  superset_data:
  n8n_data:

networks:
  datains_net:
    driver: bridge