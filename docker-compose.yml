version: "3.9"

services:
  # ─────────────────────────────────────────
  # DATABASES (Full PostgreSQL)
  # ─────────────────────────────────────────
  db_oltp:
    image: postgres:15
    container_name: datains_oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_akademik
    ports:
      - "5433:5432"
    volumes:
      - oltp_data:/var/lib/postgresql/data
      - ./backend/app/db/oltp/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - datains_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_akademik"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_sdm:
    image: postgres:15
    container_name: datains_sdm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_sdm
    ports:
      - "5434:5432"
    volumes:
      - sdm_data:/var/lib/postgresql/data
      - ./backend/app/db/oltp/init_sdm.sql:/docker-entrypoint-initdb.d/init_sdm.sql
    networks:
      - datains_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_sdm"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_warehouse:
    image: postgres:15
    container_name: datains_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./backend/app/db/olap/init_warehouse.sql:/docker-entrypoint-initdb.d/init_warehouse.sql
    networks:
      - datains_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # BACKEND (FastAPI)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datains_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8005:8000"
    depends_on:
      db_oltp:
        condition: service_healthy
      db_sdm:
        condition: service_healthy
      db_warehouse:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - datains_net
    extra_hosts:
      - "dash.varguard.id:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────
  # FRONTEND (React Biasa - Cleaned)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datains_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3005:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # ETL (Python)
  # ─────────────────────────────────────────
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: datains_etl
    restart: unless-stopped
    env_file: .env
    depends_on:
      db_oltp:
        condition: service_healthy
      db_warehouse:
        condition: service_healthy
    volumes:
      - ./etl:/app
    networks:
      - datains_net
    command: tail -f /dev/null

  # ─────────────────────────────────────────
  # APACHE SUPERSET (BI Dashboard)
  # ─────────────────────────────────────────
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: datains_superset
    restart: unless-stopped
    env_file: .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
  #  ports:
  #   - "8088:8088"
    depends_on:
      db_warehouse:
        condition: service_healthy
    volumes:
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py
      - superset_data:/app/superset_home
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # N8N (AI Chatbot Workflow)
  # ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: datains_n8n
    restart: unless-stopped
  #  ports:
  #    - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: localhost
      N8N_PORT: 5678
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - datains_net

  # ─────────────────────────────────────────
  # NGINX (Reverse Proxy)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: datains_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    #  - superset
    networks:
      - datains_net

volumes:
  oltp_data:
  sdm_data:
  warehouse_data:
  superset_data:
  n8n_data:

networks:
  datains_net:
    driver: bridge
